# Z-Sheet — single container for the Foundation phase.
# FastAPI serves both the API (/api/*) and the built renderer SPA at :8000.
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # ZSHEET_VERSION (e.g. 0.1.0-beta.1) can be set to tag release images;
    # defaults to the local "dev" tag.
    image: zsheet-backend:${ZSHEET_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Local, gitignored configuration (ZSHEET_LLM_API_KEY / base_url / model;
    # see .env.example). Optional: without it the app runs rules-only.
    env_file:
      - path: .env
        required: false
    environment:
      ZSHEET_DATA_DIR: /app/data
    volumes:
      - zsheet-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)); sys.exit(0 if r.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  zsheet-data:
